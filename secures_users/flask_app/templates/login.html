{% extends "base.html" %}
{% block title %}Registro / Iniciar sesión{% endblock %}

{% block contenido %}
<section class="contenedor" style="max-width:900px;margin-inline:auto;">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;">

        <div>
            <h1>Registro</h1>
            <p class="subtitulo">Crea tu cuenta.</p>
            <form method="post" action="{{ url_for('registro') }}">
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" name="nombre" type="text" required>
                </div>
                <div class="campo">
                    <label for="apellido">Apellido</label>
                    <input id="apellido" name="apellido" type="text" required>
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" required>
                </div>
                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input id="contrasena" name="contrasena" type="password" required>
                </div>
                <div class="campo">
                    <label for="confirmar_contrasena">Confirmar Contraseña</label>
                    <input id="confirmar_contrasena" name="confirmar_contrasena" type="password" required>
                </div>
                <div class="acciones">
                    <button type="submit">Registrar</button>
                </div>
            </form>
        </div>

        <div>
            <h1>Iniciar sesión</h1>
            <p class="subtitulo">Ingresa tus datos.</p>
            <form method="post" action="{{ url_for('login') }}">
                <div class="campo">
                    <label for="login_email">E-mail</label>
                    <input id="login_email" name="email" type="email" required>
                </div>
                <div class="campo">
                    <label for="login_contrasena">Contraseña</label>
                    <input id="login_contrasena" name="contrasena" type="password" required>
                </div>
                <div class="acciones">
                    <button type="submit">Ingresar</button>
                </div>
            </form>
        </div>

    </div>
</section>
{% endblock %}
